<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="16" fill="url(#faviconGrad)" />

  <!-- Water/River Waves representing Mekong -->
  <path d="M4 18 Q8 15 12 18 T20 18 T28 18" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" opacity="0.6"/>
  <path d="M4 22 Q8 19 12 22 T20 22 T28 22" stroke="white" strokeWidth="1.5" fill="none" strokeLinecap="round" opacity="0.4"/>

  <!-- Cooperative Symbol - simplified -->
  <g transform="translate(16, 10)">
    <!-- Center leaf -->
    <path d="M0 5 Q-2 2 0 -4 Q2 2 0 5" fill="white" opacity="0.95"/>
    <path d="M0 -1 Q-5 -2 -6 -8 Q-1 -5 0 -1" fill="white" opacity="0.85"/>
    <path d="M0 -1 Q5 -2 6 -8 Q1 -5 0 -1" fill="white" opacity="0.85"/>

    <!-- Three cooperation dots -->
    <circle cx="-8" cy="1" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="8" cy="1" r="2.5" fill="white" opacity="0.9"/>
    <circle cx="0" cy="-10" r="2.5" fill="white" opacity="0.9"/>
  </g>

  <!-- Gradient -->
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#047857;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>