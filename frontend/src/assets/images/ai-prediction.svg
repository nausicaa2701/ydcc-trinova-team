<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <!-- Background -->
  <rect width="600" height="400" rx="16" fill="#0F172A"/>

  <!-- Grid -->
  <defs>
    <pattern id="gridAI" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="dangerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#gridAI)" opacity="0.4"/>

  <!-- Chart Area -->
  <rect x="50" y="50" width="500" height="280" rx="12" fill="#1E293B" stroke="#334155"/>

  <!-- Y-Axis Labels -->
  <text x="65" y="80" fill="#64748B" font-size="10" font-family="system-ui">6.0‰</text>
  <text x="65" y="130" fill="#64748B" font-size="10" font-family="system-ui">4.0‰</text>
  <text x="65" y="180" fill="#64748B" font-size="10" font-family="system-ui">2.0‰</text>
  <text x="65" y="230" fill="#64748B" font-size="10" font-family="system-ui">1.0‰</text>
  <text x="65" y="280" fill="#64748B" font-size="10" font-family="system-ui">0.0‰</text>

  <!-- X-Axis Labels -->
  <text x="120" y="310" fill="#64748B" font-size="10" font-family="system-ui">T2</text>
  <text x="180" y="310" fill="#64748B" font-size="10" font-family="system-ui">T3</text>
  <text x="240" y="310" fill="#64748B" font-size="10" font-family="system-ui">T4</text>
  <text x="300" y="310" fill="#64748B" font-size="10" font-family="system-ui">T5</text>
  <text x="360" y="310" fill="#64748B" font-size="10" font-family="system-ui">T6</text>
  <text x="420" y="310" fill="#64748B" font-size="10" font-family="system-ui">T7</text>
  <text x="480" y="310" fill="#64748B" font-size="10" font-family="system-ui">CN</text>

  <!-- Grid Lines -->
  <line x1="100" y1="125" x2="530" y2="125" stroke="#EF4444" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="480" y="120" fill="#EF4444" font-size="9" font-family="system-ui">Ngưỡng 4‰</text>

  <line x1="100" y1="225" x2="530" y2="225" stroke="#F59E0B" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="480" y="220" fill="#F59E0B" font-size="9" font-family="system-ui">Ngưỡng 1‰</text>

  <!-- Historical Data Line (solid) -->
  <path d="M120 200 L180 210 L240 190 L300 185" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="120" cy="200" r="5" fill="#10B981"/>
  <circle cx="180" cy="210" r="5" fill="#10B981"/>
  <circle cx="240" cy="190" r="5" fill="#10B981"/>
  <circle cx="300" cy="185" r="5" fill="#10B981" stroke="#0F172A" stroke-width="2"/>

  <!-- Prediction Line (dashed) with confidence band -->
  <path d="M300 185 L360 150 L420 120 L480 100" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="8,4" stroke-linecap="round"/>
  <path d="M300 185 L360 140 L420 100 L480 75 L480 125 L420 140 L360 160 L300 185" fill="url(#chartGrad)" opacity="0.3"/>

  <!-- Danger Zone Highlight -->
  <rect x="400" y="65" width="130" height="60" fill="#EF4444" opacity="0.1" rx="4"/>

  <!-- Prediction Points -->
  <circle cx="360" cy="150" r="4" fill="#10B981" stroke="#0F172A" stroke-width="2" opacity="0.8"/>
  <circle cx="420" cy="120" r="4" fill="#F59E0B" stroke="#0F172A" stroke-width="2" opacity="0.8"/>
  <circle cx="480" cy="100" r="4" fill="#EF4444" stroke="#0F172A" stroke-width="2" opacity="0.8">
    <animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- AI Badge -->
  <rect x="420" y="140" width="110" height="35" rx="6" fill="#8B5CF6" opacity="0.9"/>
  <text x="435" y="155" fill="white" font-size="9" font-family="system-ui" font-weight="bold">AI DỰ BÁO</text>
  <text x="435" y="168" fill="white" font-size="10" font-family="system-ui">Vượt ngưỡng: 5 ngày</text>

  <!-- Legend -->
  <rect x="100" y="340" width="400" height="40" rx="8" fill="#1E293B"/>
  <line x1="120" y1="360" x2="150" y2="360" stroke="#10B981" stroke-width="3"/>
  <text x="160" y="364" fill="#94A3B8" font-size="11" font-family="system-ui">Dữ liệu thực tế</text>
  <line x1="280" y1="360" x2="310" y2="360" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="320" y="364" fill="#94A3B8" font-size="11" font-family="system-ui">Dự báo AI (7-30 ngày)</text>

  <!-- Risk Score Panel -->
  <rect x="50" y="340" width="40" height="40" rx="8" fill="#EF4444"/>
  <text x="53" y="355" fill="white" font-size="7" font-family="system-ui">RỦI RO</text>
  <text x="55" y="372" fill="white" font-size="14" font-weight="bold" font-family="system-ui">78</text>
</svg>