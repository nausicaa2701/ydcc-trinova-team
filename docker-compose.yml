services:
  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mekong-farm-frontend
    environment:
      - VITE_API_URL=https://icoopmk-api.trinova.it.com
      - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
      - VIRTUAL_HOST=icoopmk.trinova.it.com
      - VIRTUAL_PORT=80
      - LETSENCRYPT_HOST=icoopmk.trinova.it.com
      - LETSENCRYPT_EMAIL=trungnguyen.19972707@gmail.com
    depends_on:
      - backend
    networks:
      - web
    restart: unless-stopped

  # Backend service
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mekong-farm-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/mekong_farm
      - DB_HOST=postgres
      - VIRTUAL_HOST=icoopmk-api.trinova.it.com
      - VIRTUAL_PORT=8000
      - LETSENCRYPT_HOST=icoopmk-api.trinova.it.com
      - LETSENCRYPT_EMAIL=trungnguyen.19972707@gmail.com
    volumes:
      - ./backend:/app/backend
      - ./dataset:/app/dataset
    depends_on:
      - postgres
    networks:
      - web
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: mekong_farm
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - web
volumes:
  postgres_data:
networks:
  web:
    external: true

# Usage:
# 1. Create .env file with required variables:
#    VITE_MAPBOX_TOKEN=your_mapbox_token_here
#    DATABASE_URL=sqlite:///./test.db (or your database URL)
#    SECRET_KEY=your-secret-key
#
# 2. Build and run:
#    docker-compose up -d
#
# 3. View logs:
#    docker-compose logs -f frontend
#    docker-compose logs -f backend
#
# 4. Stop:
#    docker-compose down
#
# 5. Rebuild:
#    docker-compose up -d --build
