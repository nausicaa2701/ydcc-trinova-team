services:
  frontend:
    image: ydcc-trinova-team-frontend:latest
    container_name: mekong-farm-frontend
    ports:
      - "9090:80"
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    depends_on:
      - backend
    networks:
      - mekong-network
    restart: unless-stopped

  backend:
    image: ydcc-trinova-team-backend:latest
    container_name: mekong-farm-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/mekong_farm
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-me}
      - ENVIRONMENT=development
      - CORS_ALLOW_ORIGINS=http://localhost:80,http://localhost,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:8088,http://localhost:9090
    volumes:
      - ./backend:/app/backend
      - ./dataset:/app/dataset
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mekong-network
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: mekong-farm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: mekong_farm
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mekong-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  mekong-network:
    driver: bridge